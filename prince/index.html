<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MCQ Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
<main>
  <div class="topbar">
    <h1><span id="student-name">Student</span>: <span data-t="title">MCQ Progress</span></h1>
    <div class="lang-switch" role="group" aria-label="Language / ভাষা">
      <button type="button" data-lang="bn" aria-pressed="true">বাংলা</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </div>
  <p class="sub" id="sub"></p>
  <p><button class="report-btn" id="open-report" type="button" data-t="openReport">Open overall report</button></p>

  <section class="profile" id="profile"></section>
  <section class="tiles" id="tiles"></section>

  <div class="filters" id="filters"></div>

  <section class="charts">
    <div class="card chart"><h2 data-t="cScore"></h2><p class="how" data-t="cScoreHow"></p><div class="plot" id="plot-score"></div></div>
    <div class="card chart"><h2 data-t="cSlow"></h2><p class="how" data-t="cSlowHow"></p><div class="plot" id="plot-slow"></div></div>
    <div class="card chart"><h2 data-t="cCws"></h2><p class="how" data-t="cCwsHow"></p><div class="plot" id="plot-cws"></div></div>
    <div class="card chart"><h2 data-t="cSpeed"></h2><p class="how" data-t="cSpeedHow"></p><div class="plot" id="plot-speed"></div></div>
  </section>

  <section class="card written" id="written-sec" hidden>
    <h2 data-t="wTitle"></h2>
    <p class="how" id="w-sub"></p>
    <div class="tiles" id="w-tiles"></div>
    <div class="plot" id="plot-written"></div>
    <div class="table-wrap"><table>
      <thead><tr><th data-t="thDate"></th><th data-t="thSubj"></th><th class="left" data-t="thCh"></th><th data-t="wQ"></th><th data-t="wMarks"></th><th data-t="thScore2"></th><th data-t="wTime"></th></tr></thead>
      <tbody id="wrows"></tbody>
    </table></div>
  </section>

  <section class="card report" id="report">
    <h2 data-t="reportTitle"></h2>
    <div id="report-body"></div>
  </section>

  <section class="card">
    <h2 data-t="allTests"></h2>
    <div class="table-wrap"><table>
      <thead><tr><th data-t="thDate"></th><th data-t="thSubj"></th><th class="left" data-t="thCh"></th><th data-t="thTotal"></th><th data-t="thTime"></th>
        <th data-t="correct"></th><th data-t="wrong"></th><th data-t="skipped"></th><th data-t="thScore"></th><th data-t="thVs"></th><th data-t="thPer"></th><th class="left" data-t="thBook"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
  <footer data-t="footer"></footer>
</main>

<div class="modal-backdrop" id="report-modal" hidden>
  <div class="modal card report" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div class="lang-switch" role="group" aria-label="Language / ভাষা">
        <button type="button" data-lang="bn" aria-pressed="true">বাংলা</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
      <button class="modal-x" id="modal-close" type="button" aria-label="Close">&times;</button>
    </div>
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <p class="modal-foot"><button class="report-btn" id="modal-ok" type="button"></button></p>
  </div>
</div>
<script src="../assets/i18n.js"></script>
<script src="../assets/report.js"></script>
<script src="../assets/gist.js"></script>
<script src="../assets/student.js"></script>
</body>
</html>
